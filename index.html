<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Token Ben Heinz</title>
  <style>
    :root{
      --bg:#cfe9d6;
      --text:#0f1a14;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height:100vh;
    }
    .wrap{
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 16px 32px;
    }
    .topbar{
      position: relative;
      padding-top: 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 56px;
    }
    .logo{
      position:absolute;
      left:0;
      top:0;
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 10px;
    }
    h1{
      margin:0;
      font-size: 22px;
      font-weight: 800;
      text-align:center;
    }
    .spacer-lg{height: 26px;}
    .tokens{
      font-size: 30px;
      font-weight: 800;
      text-align:center;
    }
    .section-title{
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <img class="logo" src="1.png" alt="Bild" />
      <h1>Token Ben Heinz</h1>
    </div>

    <div class="spacer-lg"></div>

    <div class="tokens">0 gesammelte Tokens</div>

    <div class="spacer-lg"></div>

    <p class="section-title">Bereits erhaltene Belohnungen:</p>
  </div>
</body>
</html>
